# Schema for the configuration files of the EPAM DIAL provider module.
ai_provider_epamdial.settings:
  type: config_object
  label: 'EPAM DIAL provider settings'
  mapping:
    api_key:
      type: string
      label: 'API Key ID'
      description: 'The ID of the key containing the EPAM DIAL API key'
    api_url:
      type: string
      label: 'API Endpoint URL'
      description: 'The base URL for the EPAM DIAL API service'
    override_capabilities:
      type: boolean
      label: 'Override Model Capabilities'
      description: 'When enabled, all models will be treated as capable of all operation types'
